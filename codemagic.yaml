
workflows:
  external-ly-unsigned-ipa:
    name: External Ly - IPA validation
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ExternalLy.xcodeproj
        XCODE_SCHEME: ExternalLy
        APP_NAME: ExternalLy
    scripts:
      - name: Build External Ly
        script: |
          set -e
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate Info.plist
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/$APP_NAME.app"
          PLIST="$APP_PATH/Info.plist"

          test -f "$PLIST"
          plutil -lint "$PLIST"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST")
          test -f "$APP_PATH/$EXECUTABLE"

          echo "External Ly validation successful!"

      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/$APP_NAME.app"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/unsigned-ipa/Payload/"
          cd "$CM_BUILD_DIR/build/unsigned-ipa"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/ExternalLy-unsigned.ipa" Payload

    artifacts:
      - build/ExternalLy-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

