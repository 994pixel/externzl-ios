workflows:
  external-ly-ios:
    name: External Ly iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.externally.panel
      vars:
        XCODE_PROJECT: ExternalLy.xcodeproj
        XCODE_SCHEME: ExternalLy
      xcode: latest
    scripts:
      - name: Apply signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
